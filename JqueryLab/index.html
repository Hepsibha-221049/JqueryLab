<!DOCTYPE html>
<html>

<head>
    <title>jQuery Queue & Control</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        #box {
            width: 100px;
            height: 100px;
            background: red;
            position: relative;
        }
    </style>
</head>

<body>

    <h2>Queue & Animation Control</h2>

    <div id="box"></div>

    <br>

    <button id="start">Start Animation</button>
    <button id="stop">Stop</button>
    <button id="finish">Finish</button>
    <button id="clear">Clear Queue</button>
    <button id="delay">Delay Animation</button>

    <script src="script.js"></script>

</body>

</html>
