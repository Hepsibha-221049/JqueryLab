<!DOCTYPE html>
<html>

<head>
    <title>jQuery Attributes Demo</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>

    <h2>jQuery Attributes Example</h2>
    <img id="myImg" src="../image.jpg" width="200">

    <br><br>
    <input type="checkbox" id="check"> Accept Terms

    <br><br>
    <input type="text" id="name" placeholder="Enter name">

    <br><br>

    <button id="changeImg">Change Image</button>
    <button id="disableCheck">Disable Checkbox</button>
    <button id="getValue">Get Input Value</button>
    <button id="remove">Remove Attribute</button>

    <script src="script.js"></script>

</body>

</html>
