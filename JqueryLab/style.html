<!DOCTYPE html>
<html>

<head>
    <title>jQuery Styling Demo</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h2 id="title">jQuery Styling Example</h2>

    <div class="box">This is a box</div>

    <button id="colorBtn">Change Color</button>
    <button id="addClassBtn">Add Highlight</button>
    <button id="removeClassBtn">Remove Highlight</button>
    <button id="toggleClassBtn">Toggle Highlight</button>
    <button id="checkClassBtn">Check Class</button>
    <button id="themeBtn">Toggle Theme</button>

    <script src="script.js"></script>

</body>

</html>
